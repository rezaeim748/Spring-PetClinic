<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'owners')}">

<body>

<h2>Contracts</h2>

<table id="owners" class="table table-striped">
    <thead>
    <tr>
        <th style="width: 150px;">Owner</th>
        <th style="width: 150px;">Name</th>
        <th style="width: 200px;">Description</th>
        <th style="width: 120px">basePrice</th>
        <th>Used Items</th>
        <th>SUM</th>
        <th>Actions</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="contract : ${listContracts}">
        <td th:text="${contract.ownerName}"></td>

        <td>
            <a th:href="@{/contracts/details.html(contractId=${contract.contractId})}"
               th:text="${contract.contractName}">
            </a>
        </td>

        <td th:text="${contract.description}"></td>

        <td th:text="${contract.basePrice}"></td>

        <td th:text="${contract.usedItemsCount}"></td>

        <td th:text="${contract.currentPriceSum + ' €'}"></td>

        <td>
            <a th:href="@{/contracts/addItem(contractId=${contract.contractId})}"
               class="btn btn-sm btn-primary">Add Item</a>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
